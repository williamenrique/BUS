<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Mantenimiento</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            background: white;
            padding: 3rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 480px;
            border: 1px solid #e2e8f0;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #1e40af; }
        p { color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🛠️</div>
        <h1>Sitio en Mantenimiento</h1>
        <p>Estamos realizando mejoras en el sistema para brindarte un mejor servicio. Por favor, vuelve a intentarlo en unos minutos.</p>
        <small style="color: #94a3b8;">SITGO · Sistema de Gestión</small>
    </div>
</body>
</html>
